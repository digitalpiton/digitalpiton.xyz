<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
	<title>digital piton</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="digitalpiton website">
	<style> *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        font-family: "Garamond";
      }

      body {
        margin: 0;
        min-height: 100vh;
        text-rendering: optimizeSpeed;
        line-height: 1.5;
        font-size: 1.2em;
        padding: 1em;
      }

      h1 {
        font-size: 1.25em;
      }

      li {
        margin-bottom: 1em;
      }

      pre {
        white-space: pre-wrap;
        margin: 2em 0;
      }

      pre,
      .tag {
        font-family: monospace;
      }

      .tag::before {
        content: "<";
      }

      .tag::after {
        content: ">";
      }
	
    .cursor {
	    font-family: Courier New;
		  animation-name: animate;
		  animation-duration: 0.3s;
		  animation-iteration-count: infinite;
		  animation-direction: normal;
	  }
	  
	  @keyframes animate {
	     from {opacity: 0;}
		 to {opacity: 1;}
	  }  
	</style>
  </head>
  <body>
    <h1>digital piton:</h1>
	<p><i>hopefully a foothold</i></p>
	<table>
	  <tr>
	    <td><p style="font-family:Courier New">:~$</p></td>
        <td><div class="cursor">
          <p>[]</p>
        </div></td>
	</table>
  </body>
 </html>
